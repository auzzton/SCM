spring:
  application:
    name: scm-server

  # ─── DataSource ────────────────────────────────────────────
  # Override via environment variables in Docker / Kubernetes.
  # Defaults to Neon (remote dev DB) when running locally without Docker.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-damp-bonus-a1r4dt4p-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    # ⚠️ Move this to an environment variable or AWS Secrets Manager in production.
    password: ${SPRING_DATASOURCE_PASSWORD:npg_twsOWYg2Rnr5}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # ─── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ─── Kafka ─────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: scm-server-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.scm.server.event"

# ─── JWT Security ──────────────────────────────────────────
application:
  security:
    jwt:
      # 256-bit hex key — override in production via environment variable
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

# ─── Spring Actuator & Prometheus ──────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true   # Enables /actuator/health/liveness & /readiness for K8s
  metrics:
    tags:
      application: ${spring.application.name}

# ─── Swagger / OpenAPI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ─── Logging ───────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.scm: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
