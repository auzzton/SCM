# ============================================================
# scm-client — Service (ClusterIP)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: scm-client-svc
  namespace: scm
  labels:
    app: scm-client
spec:
  type: ClusterIP
  selector:
    app: scm-client
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
