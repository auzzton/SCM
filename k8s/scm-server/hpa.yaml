# ============================================================
# scm-server — Horizontal Pod Autoscaler
# Scales replicas between 2 and 8 based on CPU/Memory load.
# Requires metrics-server installed on EKS.
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scm-server-hpa
  namespace: scm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scm-server
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale out when avg CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80   # Scale out when avg Memory > 80%
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120  # Wait 2 min before scaling down
